<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1f3a"><title>CW Manutenção</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="shell"><aside id="sidebar"><div class="brand"><b>CW</b><span><strong>CW Manutenção</strong><small>Gestão de demandas</small></span></div><nav><button class="nav active" data-view="dashboard">▦ Visão geral</button><button class="nav" data-view="demandas">☷ Demandas</button><button class="nav" data-view="nova">＋ Nova demanda</button></nav><div class="user"><i>WO</i><span><strong>Welber Oliveira</strong><small>Administrador</small></span></div></aside>
<main><header><button id="menu">☰</button><div><h1 id="title">Visão geral</h1><p id="subtitle">Acompanhe as demandas de manutenção</p></div><button class="primary" data-new>＋ Nova demanda</button></header>
<section id="dashboard" class="view active"><div class="cards" id="metrics"></div><div class="grid"><article class="panel"><div class="heading"><span><h2>Demandas por status</h2><p>Distribuição atual</p></span></div><div id="statusChart"></div></article><article class="panel"><div class="heading"><span><h2>Prioridades</h2><p>Demandas ainda não concluídas</p></span></div><div id="priorities"></div></article></div><article class="panel recent"><div class="heading"><span><h2>Demandas recentes</h2><p>Últimos registros</p></span><button class="link" data-go="demandas">Ver todas →</button></div><div id="recent"></div></article></section>
<section id="demandas" class="view"><article class="panel"><div class="filters"><label class="search">⌕ <input id="search" placeholder="Buscar demanda, local ou responsável..."></label><select id="filterStatus"><option value="">Todos os status</option></select><select id="filterPriority"><option value="">Todas as prioridades</option></select></div><div id="list"></div></article></section>
<section id="nova" class="view"><article class="panel form-panel"><div class="heading"><span><h2>Cadastrar demanda</h2><p>Registre uma nova solicitação</p></span></div><form id="form"></form></article></section></main></div><div id="toast"></div><script src="app.js"></script></body></html>
